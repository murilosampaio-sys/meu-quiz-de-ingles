<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Food Vocabulary & Idioms Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .quiz-card {
      background-color: #1e1e1e;
      border: 2px solid #00bcd4;
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: #00bcd4;
      text-align: center;
      margin-top: 0;
      font-size: 1.5rem;
    }

    /* Nova Barra de Progresso Visual */
    .progress-container {
      width: 100%;
      background-color: #333;
      border-radius: 8px;
      height: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #00bcd4;
      transition: width 0.3s ease;
    }

    .progress-text {
      color: #ffeb3b;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.1rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      gap: 10px;
    }

    .option-btn {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444;
      padding: 12px 16px;
      border-radius: 6px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #3a3a3a;
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* Estilos para destaque de respostas (Melhoria UI) */
    .option-btn.btn-correct {
      background-color: #2e7d32 !important;
      border-color: #4caf50 !important;
      color: #ffffff;
    }

    .option-btn.btn-wrong {
      background-color: #c62828 !important;
      border-color: #f44336 !important;
      color: #ffffff;
    }

    .feedback {
      margin-top: 16px;
      font-weight: bold;
      min-height: 24px;
    }

    .correct {
      color: #4caf50;
    }

    .wrong {
      color: #f44336;
    }

    .next-btn, .restart-btn {
      background-color: #00bcd4;
      color: #121212;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
    }

    .next-btn:hover, .restart-btn:hover {
      background-color: #00acc1;
    }

    .hidden {
      display: none;
    }

    .final-score {
      text-align: center;
    }

    .final-score h2 {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <h1>🍔 FOOD VOCABULARY & IDIOMS 🍰</h1>

    <!-- Tela do Quiz -->
    <div id="quiz-screen">
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="progress" class="progress-text">Question 1/34</div>
      <div id="question" class="question-text"></div>
      <div id="options" class="options-grid"></div>
      <div id="feedback" class="feedback" aria-live="polite"></div>
      <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Próxima Pergunta</button>
    </div>

    <!-- Tela Final -->
    <div id="result-screen" class="final-score hidden">
      <h2>Game Over!</h2>
      <p id="final-score-text" style="font-size: 1.2rem;"></p>
      <p id="message-text" style="font-weight: bold;"></p>
      <button class="restart-btn" onclick="startQuiz()">Jogar Novamente 🔄</button>
    </div>
  </div>

  <script>
    const originalQuestions = [
      // Perguntas de Vocabulário Originais
      { question: "Which word describes food that is salty and tastes like seawater (e.g., raw oysters)?", options: ["briny", "earthy", "bland", "airy"], answer: "briny" },
      { question: "If a warm brownie or melted cheese is thick, soft, and warm, it is considered:", options: ["gooey", "crumbly", "burnt", "flaky"], answer: "gooey" },
      { question: "Mozzarella cheese has a gentle, subtle taste that is not strong or spicy. It is:", options: ["mild", "pungent", "tangy", "rich"], answer: "mild" },
      { question: "Unseasoned boiled potatoes lack flavor and taste uninteresting. They are:", options: ["bland", "exquisite", "umami", "silky"], answer: "bland" },
      { question: "Greek yogurt and lemon juice have a sharp, tart, and zesty acid flavor called:", options: ["tangy", "comforting", "smoky", "velvety"], answer: "tangy" },
      { question: "A hot bowl of soup on a rainy day that makes you feel happy and warm is:", options: ["comforting", "sickly sweet", "briny", "pungent"], answer: "comforting" },
      { question: "Foods like wild mushrooms and truffles that taste like soil or nature are:", options: ["earthy", "airy", "sticky", "gooey"], answer: "earthy" },
      { question: "Raw garlic and strong blue cheese have an intense, sharp smell and taste described as:", options: ["pungent", "mild", "flaky", "silky"], answer: "pungent" },
      { question: "A dessert heavy in cream, butter, and dark chocolate is very heavy and full of fat. It is:", options: ["rich", "bland", "airy", "briny"], answer: "rich" },
      { question: "Barbecue ribs cooked over wood chips have a distinctive wood-fire flavor called:", options: ["smoky", "tangy", "velvety", "sickly sweet"], answer: "smoky" },
      { question: "High-grade Wagyu beef is so soft that it dissolves effortlessly in your mouth. It is:", options: ["melt-in-your-mouth", "crumbly", "burnt", "bland"], answer: "melt-in-your-mouth" },
      { question: "Slow-cooked pork ribs tender enough to separate from the rib effortlessly are:", options: ["fall off the bone", "sticky", "airy", "mild"], answer: "fall off the bone" },
      { question: "A tender steak that requires almost no pressure to slice with a knife:", options: ["cuts like butter", "crumbly", "burnt", "briny"], answer: "cuts like butter" },
      { question: "A soufflé or mousse filled with tiny air bubbles has a texture that is:", options: ["airy", "gooey", "pungent", "rich"], answer: "airy" },
      { question: "Feta cheese or shortbread cookies easily break apart into small dry pieces. They are:", options: ["crumbly", "silky", "velvety", "sticky"], answer: "crumbly" },
      { question: "A butter croissant made of thin, crisp layers that separate easily is:", options: ["flaky", "earthy", "bland", "pungent"], answer: "flaky" },
      { question: "A fine panna cotta that slides across your tongue with absolute smoothness is:", options: ["silky", "burnt", "crumbly", "briny"], answer: "silky" },
      { question: "A thick cream soup or chocolate ganache with a plush, smooth texture is described as:", options: ["velvety", "tangy", "flaky", "airy"], answer: "velvety" },
      { question: "Ordering a giant, expensive triple-chocolate ice cream sundae is a special treat. It is:", options: ["indulgent", "mild", "bland", "earthy"], answer: "indulgent" },
      { question: "A dish prepared with extreme delicacy, beauty, and high culinary refinement is:", options: ["exquisite", "burnt", "sticky", "sickly sweet"], answer: "exquisite" },
      { question: "A dish combining sweet, sour, spicy, and savory notes in a complex way has an:", options: ["interesting flavor profile", "airy texture", "earthy smell", "unpleasant taste"], answer: "interesting flavor profile" },
      { question: "Soy sauce, ripe tomatoes, and parmesan cheese have a deep, savory taste known as:", options: ["umami", "briny", "tangy", "flaky"], answer: "umami" },
      { question: "Honey and maple syrup cling to your fingers and teeth easily. They are:", options: ["sticky", "crumbly", "mild", "airy"], answer: "sticky" },
      { question: "Bread left in the toaster for too long turns black and bitter because it is:", options: ["burnt", "velvety", "rich", "exquisite"], answer: "burnt" },
      { question: "A dessert with way too much artificial sugar that makes you feel slightly sick is:", options: ["sickly sweet", "comforting", "earthy", "umami"], answer: "sickly sweet" },

      // Novas Expressões Idiomáticas
      { question: "When something is extremely easy to do, you can say it is:", options: ["a piece of cake", "in a pickle", "a bad apple", "a hard nut to crack"], answer: "a piece of cake" },
      { question: "If you have to be extremely cautious about what you say or do around someone, you are:", options: ["walking on eggshells", "a couch potato", "cool as a cucumber", "in a pickle"], answer: "walking on eggshells" },
      { question: "Someone who stays remarkably calm and relaxed, even under high stress, is:", options: ["cool as a cucumber", "sickly sweet", "a bad apple", "a couch potato"], answer: "cool as a cucumber" },
      { question: "If you take on a task that is far too big or difficult for you to handle, you:", options: ["bit off more than you can chew", "walked on eggshells", "cut like butter", "became a couch potato"], answer: "bit off more than you can chew" },
      { question: "A lazy person who spends a lot of time sitting and watching TV is called a:", options: ["couch potato", "bad apple", "hard nut to crack", "piece of cake"], answer: "couch potato" },
      { question: "If you dislike something or it is not to your personal preference, you say 'It's...':", options: ["not my cup of tea", "in a pickle", "a piece of cake", "sickly sweet"], answer: "not my cup of tea" },
      { question: "When you find yourself in a difficult, tricky, or uncomfortable situation, you are:", options: ["in a pickle", "cool as a cucumber", "walking on eggshells", "a bad apple"], answer: "in a pickle" },
      { question: "A person or problem that is very difficult to understand, solve, or deal with is:", options: ["a hard nut to crack", "a piece of cake", "a couch potato", "not my cup of tea"], answer: "a hard nut to crack" },
      { question: "A bad, dishonest, or negative person who causes trouble for an entire group is:", options: ["a bad apple", "a couch potato", "a hard nut to crack", "in a pickle"], answer: "a bad apple" }
    ];

    let questions = [];
    let currentIdx = 0;
    let score = 0;

    function shuffleArray(arr) {
      return arr.slice().sort(() => Math.random() - 0.5);
    }

    function startQuiz() {
      questions = shuffleArray(originalQuestions);
      currentIdx = 0;
      score = 0;
      document.getElementById("quiz-screen").classList.remove("hidden");
      document.getElementById("result-screen").classList.add("hidden");
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentIdx];
      
      // Atualizar indicador textual e barra visual de progresso
      document.getElementById("progress").innerText = `Question ${currentIdx + 1}/${questions.length}`;
      const progressPercent = ((currentIdx) / questions.length) * 100;
      document.getElementById("progress-bar").style.width = `${progressPercent}%`;

      document.getElementById("question").innerText = q.question;
      document.getElementById("feedback").innerText = "";
      document.getElementById("next-btn").classList.add("hidden");

      const optionsDiv = document.getElementById("options");
      optionsDiv.innerHTML = "";

      const shuffledOpts = shuffleArray(q.options);
      shuffledOpts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(btn, opt, q.answer);
        optionsDiv.appendChild(btn);
      });
    }

    function selectAnswer(selectedBtn, selectedText, correctText) {
      const btns = document.querySelectorAll(".option-btn");
      btns.forEach(btn => {
        btn.disabled = true;
        // Destaque visual: destaca o correto e o incorreto clicado
        if (btn.innerText === correctText) {
          btn.classList.add("btn-correct");
        }
      });

      const feedback = document.getElementById("feedback");
      if (selectedText === correctText) {
        score++;
        feedback.className = "feedback correct";
        feedback.innerText = "✓ Correct!";
      } else {
        selectedBtn.classList.add("btn-wrong");
        feedback.className = "feedback wrong";
        feedback.innerText = `✗ Wrong! Correct answer was: ${correctText}`;
      }

      document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById("progress-bar").style.width = "100%";
      document.getElementById("quiz-screen").classList.add("hidden");
      const resultScreen = document.getElementById("result-screen");
      resultScreen.classList.remove("hidden");

      const percentage = (score / questions.length) * 100;
      document.getElementById("final-score-text").innerText = `Your Final Score: ${score}/${questions.length}`;

      const msg = document.getElementById("message-text");
      if (percentage === 100) {
        msg.className = "correct";
        msg.innerText = "Perfect Score! You're a vocabulary master! 🏆";
      } else if (percentage >= 70) {
        msg.className = "progress-text";
        msg.innerText = "Great job! Excellent knowledge of culinary terms and idioms. 👏";
      } else {
        msg.className = "wrong";
        msg.innerText = "Keep practicing! Try again to improve your score. 💪";
      }
    }

    // Inicializar o quiz ao carregar
    startQuiz();
  </script>

</body>
</html>
